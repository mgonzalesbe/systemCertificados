services:
  - type: web
    name: system-certificados
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: FLASK_DEBUG
        value: "false"
      - key: PUBLIC_APP_URL
        sync: false
      - key: DB_SERVER
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_DRIVER
        value: "ODBC Driver 18 for SQL Server"
      - key: DB_TRUSTED
        value: "false"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_ENCRYPT
        value: "yes"
      - key: DB_TRUST_SERVER_CERTIFICATE
        value: "no"
      - key: DB_CONNECTION_TIMEOUT
        value: "30"
      - key: ISSUER_PRIVATE_KEY_B64
        sync: false
      - key: MAIL_ENABLED
        value: "true"
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        sync: false
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "180"
